DWAPlannerROS:
  # 轨迹采样
  vx_samples: 20
  vy_samples: 0
  vth_samples: 40
  
  # 速度和加速度限制
  max_vel_x: 0.3
  min_vel_x: -0.1
  max_vel_theta: 1.0
  min_vel_theta: -1.0
  acc_lim_x: 0.5
  acc_lim_theta: 1.0
  
  # 前向模拟距离
  sim_time: 1.5
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  
  # 惩罚权重
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.01
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  
  # 震荡检测
  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.2
  
  # 控制频率设置
  controller_frequency: 5.0
  controller_patience: 1.0
  planner_patience: 5.0
  
  # 障碍物避免
  max_vel_y: 0.0
  min_vel_y: 0.0
  acc_lim_y: 0.0
  lat_dist: 0.3
  meter_scoring: true
  
  # 目标容差
  xy_goal_tolerance: 0.1
  yaw_goal_tolerance: 0.1
  latch_xy_goal_tolerance: false


    # 允许通过ROS参数动态调整
  ~max_vel_x: 0.5
  ~min_vel_x: -0.2
  ~acc_lim_x: 2.5
  ~vx_samples: 20
  ~max_rot_vel: 1.0